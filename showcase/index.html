<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ember Depths — pixel-magic showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    overflow: hidden;
  }
  h1 {
    font-size: 1.6rem;
    margin: 12px 0 4px;
    color: #ff6b35;
    text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
    letter-spacing: 0.15em;
  }
  .subtitle {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 10px;
  }
  .subtitle a { color: #ff6b35; text-decoration: none; }
  .subtitle a:hover { text-decoration: underline; }
  canvas {
    border: 2px solid #333;
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<h1>EMBER DEPTHS</h1>
<p class="subtitle">generated with <a href="https://github.com/BedirT/pixel-magic">pixel-magic</a></p>
<canvas id="scene"></canvas>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────
const TILE_W = 64;
const TILE_H = 36;    // native isometric tile height
const MAP_COLS = 10;
const MAP_ROWS = 10;
const FPS = 8;

const BASE = 'assets';
const TILE_DIR = `${BASE}/tiles/tiles/custom`;         // native size (64x36)
const OBJ_DIR  = `${BASE}/objects/objects/custom`;      // native size (varied)
const CHAR_DIR = `${BASE}/characters`;
const FX_DIR   = `${BASE}/effects/effects`;

// ─── MAP DATA ────────────────────────────────────────────────────────
const TILES = [
  'grass', 'moss_stone', 'cracked_path', 'flowers',
  'dark_stone', 'crystal_floor', 'glowing_moss', 'gravel',
  'basalt', 'lava', 'cracked_obsidian', 'cooled_lava',
  'water_puddle', 'underground_water', 'magma_vein', 'ash'
];

// Three biomes top→bottom: forest → cavern → volcanic
const MAP = [
  [ 0, 0, 3, 0, 0, 3, 0, 0, 0, 3],
  [ 0, 3, 0, 0, 2, 2, 0, 3, 0, 0],
  [ 0, 0, 2, 2, 1, 1, 2, 0, 0, 0],
  [ 1, 2, 1,12, 2, 2,12, 1, 2, 0],
  [ 4, 4, 7, 4, 5, 5, 4, 7, 4, 4],
  [ 4, 6, 4, 5, 4,13, 5, 4, 6, 4],
  [ 7, 4, 5, 4, 7, 4, 4, 5, 4, 7],
  [ 8, 8,11, 8, 8,10, 8, 8,11, 8],
  [ 8,10, 9, 8,14, 8, 9,10, 8,15],
  [15, 8, 9, 9, 8,15, 9, 9, 8, 8],
];

// Objects: using native size PNGs (not 64x64 which lost alpha)
const OBJECTS = [
  { row: 0, col: 6, img: 'mushroom',        scale: 0.55, oy: -42 },
  { row: 1, col: 7, img: 'overgrown_statue',scale: 0.42, oy: -50 },
  { row: 2, col: 0, img: 'broken_pillar',   scale: 0.5,  oy: -38 },
  { row: 3, col: 8, img: 'vine_archway',    scale: 0.45, oy: -45 },
  { row: 5, col: 1, img: 'crystal_cluster', scale: 0.6,  oy: -32 },
  { row: 6, col: 7, img: 'cave_torch',      scale: 0.65, oy: -32 },
  { row: 4, col: 7, img: 'stalactite',      scale: 0.55, oy: -38 },
  { row: 7, col: 5, img: 'obsidian_spike',  scale: 0.45, oy: -42 },
  { row: 8, col: 1, img: 'fire_brazier',    scale: 0.48, oy: -40 },
  { row: 9, col: 6, img: 'magma_crystal',   scale: 0.5,  oy: -38 },
  { row: 9, col: 3, img: 'dragon_egg',      scale: 0.5,  oy: -28 },
  { row: 3, col: 3, img: 'ancient_chest',   scale: 0.55, oy: -30 },
];

// Static characters (use native views, scale down)
const CHARACTERS = [
  { row: 1, col: 2, name: 'forest-goblin', scale: 0.14, oy: -52 },
  { row: 5, col: 5, name: 'cave-bat',      scale: 0.12, oy: -48 },
  { row: 8, col: 7, name: 'fire-imp',      scale: 0.12, oy: -48 },
];

// Knight walk path through the three biomes
const KNIGHT_PATH = [
  {row: 1, col: 4}, {row: 2, col: 4}, {row: 3, col: 4},
  {row: 4, col: 4}, {row: 5, col: 4}, {row: 6, col: 4},
  {row: 7, col: 4}, {row: 8, col: 4}, {row: 8, col: 3},
  {row: 7, col: 3}, {row: 6, col: 3}, {row: 5, col: 3},
  {row: 4, col: 3}, {row: 3, col: 3}, {row: 2, col: 3},
  {row: 1, col: 3},
];

// Animated effects
const EFFECTS = [
  { row: 9, col: 1, name: 'lava-bubble',    frames: 5, scale: 0.35, oy: -18 },
  { row: 8, col: 5, name: 'fire-explosion', frames: 6, scale: 0.4,  oy: -25 },
  { row: 6, col: 2, name: 'healing-glow',   frames: 6, scale: 0.35, oy: -20 },
];

// ─── IMAGE LOADING ───────────────────────────────────────────────────
const images = {};
let loadCount = 0;
let totalToLoad = 0;

function loadImg(key, src) {
  if (images[key]) return; // dedup
  totalToLoad++;
  const img = new Image();
  img.onload = () => { loadCount++; checkReady(); };
  img.onerror = () => {
    console.warn('Failed to load:', src);
    loadCount++;
    checkReady();
  };
  img.src = src;
  images[key] = img;
}

function checkReady() {
  if (loadCount >= totalToLoad) startScene();
}

// Load tiles (native 64x36)
TILES.forEach(name => loadImg(`tile_${name}`, `${TILE_DIR}/${name}.png`));

// Load objects (native size — has proper alpha)
OBJECTS.forEach(o => loadImg(`obj_${o.img}`, `${OBJ_DIR}/${o.img}.png`));

// Load static characters (native views)
CHARACTERS.forEach(c => {
  loadImg(`char_${c.name}`, `${CHAR_DIR}/${c.name}/views/front_left.png`);
});

// Load knight walk frames (native size)
for (let i = 1; i <= 6; i++) {
  loadImg(`knight_walk_${i}`, `${CHAR_DIR}/ember-knight/animations/walk/frame_0${i}.png`);
}
// Knight idle frames
for (let i = 1; i <= 4; i++) {
  loadImg(`knight_idle_${i}`, `${CHAR_DIR}/ember-knight/animations/idle/frame_0${i}.png`);
}

// Load effect frames (native size)
EFFECTS.forEach(e => {
  for (let i = 1; i <= e.frames; i++) {
    loadImg(`fx_${e.name}_${i}`, `${FX_DIR}/${e.name}/frame_0${i}.png`);
  }
});

// ─── ISOMETRIC HELPERS ───────────────────────────────────────────────
function isoToScreen(row, col) {
  return {
    x: (col - row) * (TILE_W / 2),
    y: (col + row) * (TILE_H / 2),
  };
}

// ─── SCENE LOOP ──────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function startScene() {
  // Compute canvas bounds
  const corners = [
    isoToScreen(0, 0),
    isoToScreen(0, MAP_COLS - 1),
    isoToScreen(MAP_ROWS - 1, 0),
    isoToScreen(MAP_ROWS - 1, MAP_COLS - 1),
  ];
  const minX = Math.min(...corners.map(c => c.x));
  const maxX = Math.max(...corners.map(c => c.x)) + TILE_W;
  const minY = Math.min(...corners.map(c => c.y));
  const maxY = Math.max(...corners.map(c => c.y)) + TILE_H;

  const PAD_TOP = 120;
  const PAD_BOTTOM = 60;
  const PAD_SIDE = 30;

  canvas.width  = (maxX - minX) + PAD_SIDE * 2;
  canvas.height = (maxY - minY) + PAD_TOP + PAD_BOTTOM;

  const offsetX = -minX + PAD_SIDE;
  const offsetY = -minY + PAD_TOP;

  let frame = 0;
  let knightPathIdx = 0;
  let knightLerpT = 0;
  const KNIGHT_SPEED = 0.04;
  const KNIGHT_SCALE = 0.15;

  function drawImgAt(img, row, col, scale, oyOffset) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const pos = isoToScreen(row, col);
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    // Center horizontally on the tile, offset vertically
    const x = pos.x + offsetX + (TILE_W - w) / 2;
    const y = pos.y + offsetY + oyOffset;
    ctx.drawImage(img, x, y, w, h);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background gradient (forest→cave→volcanic)
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#1a2a1a');
    grad.addColorStop(0.35, '#1a1a2e');
    grad.addColorStop(1, '#2e1a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Collect everything for depth sorting
    const drawables = [];

    // Tiles
    for (let row = 0; row < MAP_ROWS; row++) {
      for (let col = 0; col < MAP_COLS; col++) {
        const tileName = TILES[MAP[row][col]];
        const pos = isoToScreen(row, col);
        drawables.push({
          depth: row + col,
          draw: () => {
            const img = images[`tile_${tileName}`];
            if (img && img.complete) {
              ctx.drawImage(img, pos.x + offsetX, pos.y + offsetY, TILE_W, TILE_H);
            }
          }
        });
      }
    }

    // Objects
    OBJECTS.forEach(o => {
      drawables.push({
        depth: o.row + o.col + 0.5,
        draw: () => drawImgAt(images[`obj_${o.img}`], o.row, o.col, o.scale, o.oy),
      });
    });

    // Static characters
    CHARACTERS.forEach(c => {
      drawables.push({
        depth: c.row + c.col + 0.6,
        draw: () => drawImgAt(images[`char_${c.name}`], c.row, c.col, c.scale, c.oy),
      });
    });

    // Animated knight
    const walkFrame = (frame % 6) + 1;
    const knightImg = images[`knight_walk_${walkFrame}`];
    const fromNode = KNIGHT_PATH[knightPathIdx];
    const toNode = KNIGHT_PATH[(knightPathIdx + 1) % KNIGHT_PATH.length];
    const fromPos = isoToScreen(fromNode.row, fromNode.col);
    const toPos = isoToScreen(toNode.row, toNode.col);
    const kx = fromPos.x + (toPos.x - fromPos.x) * knightLerpT;
    const ky = fromPos.y + (toPos.y - fromPos.y) * knightLerpT;
    const knightDepth = fromNode.row + fromNode.col +
      (toNode.row + toNode.col - fromNode.row - fromNode.col) * knightLerpT + 0.7;

    drawables.push({
      depth: knightDepth,
      draw: () => {
        if (knightImg && knightImg.complete && knightImg.naturalWidth) {
          const w = knightImg.naturalWidth * KNIGHT_SCALE;
          const h = knightImg.naturalHeight * KNIGHT_SCALE;
          ctx.drawImage(knightImg,
            kx + offsetX + (TILE_W - w) / 2,
            ky + offsetY - 55,
            w, h
          );
        }
      }
    });

    // Effects
    EFFECTS.forEach(e => {
      const fxFrame = (frame % e.frames) + 1;
      drawables.push({
        depth: e.row + e.col + 0.8,
        draw: () => {
          const img = images[`fx_${e.name}_${fxFrame}`];
          if (img && img.complete && img.naturalWidth) {
            const pos = isoToScreen(e.row, e.col);
            const w = img.naturalWidth * e.scale;
            const h = img.naturalHeight * e.scale;
            ctx.globalAlpha = 0.85;
            ctx.drawImage(img,
              pos.x + offsetX + (TILE_W - w) / 2,
              pos.y + offsetY + e.oy,
              w, h
            );
            ctx.globalAlpha = 1.0;
          }
        }
      });
    });

    // Sort and draw
    drawables.sort((a, b) => a.depth - b.depth);
    drawables.forEach(d => d.draw());

    // Advance knight
    knightLerpT += KNIGHT_SPEED;
    if (knightLerpT >= 1) {
      knightLerpT = 0;
      knightPathIdx = (knightPathIdx + 1) % KNIGHT_PATH.length;
    }

    frame++;
  }

  setInterval(render, 1000 / FPS);
}
</script>
</body>
</html>
